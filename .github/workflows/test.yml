name: Test SEA
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install FFmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress
      - name: Install FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - run: ffmpeg -version
      - run: python -m pip install .
      - run: sea --version
      - run: sea doctor
      - run: python -c "import mcp; import sea.server"
      - name: Generate bounded demo fixture
        run: python examples/make_demo.py ci-demo.mp4
        timeout-minutes: 2
      - name: Run test suite
        run: python -m unittest discover -s tests -v
        timeout-minutes: 5
