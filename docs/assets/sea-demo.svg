<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="370" viewBox="0 0 1120 370" role="img" aria-labelledby="title desc"><title id="title">SEA synthetic audiovisual demonstration</title><desc id="desc">Measured 440 Hz tone from two to four seconds; two detected visual changes. This is a visualization of the example report, not a client screenshot.</desc>
<rect width="1120" height="370" rx="18" fill="#0b1928"/>
<g font-family="Arial,Helvetica,sans-serif"><text x="35" y="36" fill="#80deeb" font-size="13" letter-spacing="2">SEA / REPRODUCIBLE DEMO</text><text x="35" y="67" fill="#f2f7fb" font-size="23" font-weight="bold">One recording. Two signals. One timeline.</text><text x="35" y="91" fill="#9db4c6" font-size="13">Synthetic 6-second test • visualization of measured report • 0.5 s bins</text>
<g fill="#9db4c6" font-size="12"><text x="35" y="150">Dominant tone</text><text x="35" y="211">Visual scene</text><text x="35" y="268">Change flags</text></g>
