[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sea-perception-mcp"
version = "0.12.0"
description = "Sensory Extension for Agents: local, measurable media and signal perception for MCP clients"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["mcp>=1.12,<2", "numpy>=1.26,<3", "Pillow>=10.3,<13"]

[project.optional-dependencies]
vision = ["torch>=2.6,<3", "torchvision>=0.21,<1"]
openvision = ["torch>=2.6,<3", "torchvision>=0.21,<1", "transformers>=4.57.1,<5", "safetensors>=0.4,<1", "scipy>=1.11,<2"]

[project.scripts]
sea-mcp = "sea.server:main"
sea = "sea.setup:main"

[tool.setuptools.packages.find]
include = ["sea*"]
