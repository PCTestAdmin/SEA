[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sea-perception-mcp"
version = "0.1.0"
description = "Sensory Extension for Agents: local, measurable audiovisual perception for MCP clients"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["mcp>=1.12,<2", "numpy>=1.26,<3"]

[project.scripts]
sea-mcp = "sea.server:main"

[tool.setuptools.packages.find]
include = ["sea*"]
